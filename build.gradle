import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "${kotlin_version}"
	id "org.jetbrains.kotlin.plugin.serialization" version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = "https://repo.nea.moe/mirror" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven {
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup("maven.modrinth")
		}
	}
}

dependencies {
	// 26.1+ is unobfuscated: no mappings, no remapping.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	implementation "meteordevelopment:orbit:${project.orbit_version}"
	include "meteordevelopment:orbit:${project.orbit_version}"
	api("me.shedaniel.cloth:cloth-config-fabric:${project.clothConfig_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.clothConfig_version}"
	compileOnly "maven.modrinth:modmenu:${project.modMenu_version}"
	localRuntime "maven.modrinth:modmenu:${project.modMenu_version}"
	// Jarvis (HUD editor) has no 26.1 release, so it is vendored under com.dulkirfabric.jarvis (LGPL-3.0, see LICENSE_jarvis).
}

loom {
	runs {
		removeIf { it.name != "client" }
		named("client") {
			property("fabric.log.level", "info")
			vmArg("-ea")
		}
	}
	accessWidenerPath = file("src/main/resources/dulkirmod.accesswidener")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def name = base.archivesName.get()
	inputs.property "archivesName", name
	from("LICENSE") {
		rename { "${it}_${name}" }
	}
	from("LICENSE_jarvis")
}
