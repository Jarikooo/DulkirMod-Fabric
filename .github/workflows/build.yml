name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        run: |
          chmod +x ./gradlew
          mkdir -p ci-output
          set -o pipefail
          ./gradlew build --stacktrace --continue 2>&1 | tee ci-output/build.log
      - name: dump vanilla API signatures
        if: always()
        run: bash .github/scripts/api-dump.sh || true
      - name: copy jar
        if: always()
        run: cp build/libs/*.jar ci-output/ 2>/dev/null || true
      - name: publish CI output to ci-output branch
        if: always()
        run: |
          echo "${{ github.sha }} build=${{ steps.build.outcome }}" > ci-output/status.txt
          cd ci-output
          git init -q -b ci-output
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "CI output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
      - name: capture build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
